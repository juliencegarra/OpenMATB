[Openmatb]
# If language is missing, en_EN will be loaded
language=en_EN

# If multiple screens layout, you can modify the index
# Default : screen_index=0
screen_index=0

# If you don't like the default font, feel free to specify a different one below.
# (Leave it empty to get your system default font)
font_name=

# Fullscreen mode
# Default : fullscreen=True
fullscreen=True

# Scenario choice
# Example  : scenario_path=Parasuraman_et_al_1993/high_reliability_block.txt
scenario_path=

# Display the session number at start
display_session_number=True

# Web version: check the browser on the start page (Firefox pauses for 0.1 to 1 s every few seconds)
# warn = display a notice | block = prevent starting (use Chrome or Edge) | off = no check
# Can be overridden in the page address with ?browsercheck=warn|block|off
web_browser_check=warn

# Web version: where the session files go (they are always kept in the browser too, for replay).
# Comma separated list of: download (on the participant's computer), jatos, datapipe, webdav
# e.g. web_session_output=webdav, download   to send the file to the server and also download it
# See "Web version" in README.md to set up JATOS, DataPipe or a WebDAV folder
web_session_output=download
# DataPipe experiment ID (https://pipe.jspsych.org), for "datapipe"
web_datapipe_experiment=
# WebDAV folder receiving the sessions (e.g. https://lab.example.org/openmatb/sessions/), for "webdav"
web_webdav_url=

# Hide the MATB environment on pause ("P" or "Escape" keys)
hide_on_pause=False

# Highlight widgets area of interest (AOI)
# If True, will display a red frame around each widget, as well as its name
highlight_aoi=False


# Vertical bounds between plugins areas
# (Warning: modify only if you need to change plugins from their initial default location)
# Default values: top_bounds=[0.35, 0.85] | bottom_bounds=[0.30, 0.85]
top_bounds=[0.35, 0.85]
bottom_bounds=[0.30, 0.85]