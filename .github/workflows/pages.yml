name: GitHub Pages

# The website (website/ of master) at the root, and the web version of OpenMATB (built from the
# pyglet3-pyodide-web branch) under app/, used by the Demo tab of the website.
# Runs when master is pushed; run it by hand (Actions > GitHub Pages > Run workflow) after a change of the web branch.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  WEB_BRANCH: pyglet3-pyodide-web

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.WEB_BRANCH }}
          path: web-branch
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build the web version
        run: python web-branch/web/build.py
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r website/. _site/
          cp -r web-branch/web/dist _site/app
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
